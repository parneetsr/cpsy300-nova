name: Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: cpsy300novacr.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push container image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: cpsy300novacr.azurecr.io/cpsy300-nova:${{ github.sha }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          image: cpsy300novacr.azurecr.io/cpsy300-nova:${{ github.sha }}
          resource-group: cpsy300-nova-rg
          container-app-name: cpsy300-nova-app
          target-port: 3000
          acr-name: cpsy300novacr
          acr-username: ${{ secrets.REGISTRY_USERNAME }}
          acr-password: ${{ secrets.REGISTRY_PASSWORD }}
