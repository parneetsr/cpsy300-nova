name: Build and deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ACR_NAME: cpsy300novacr
  RESOURCE_GROUP: cpsy300-nova-rg
  CONTAINERAPP: cpsy300-nova-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push container image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          push:
            true
          tags: ${{ env.ACR_NAME }}.azurecr.io/cpsy300-nova:${{ github.sha }}

      - name: Update Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/cpsy300-nova:${{ github.sha }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINERAPP }}
          targetPort: 3000
          acrName: ${{ env.ACR_NAME }}
          acrUsername: ${{ secrets.REGISTRY_USERNAME }}
          acrPassword: ${{ secrets.REGISTRY_PASSWORD }}
